plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' version '2.2.20' }
android {
    buildFeatures { buildConfig true }
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'
    namespace 'com.dotnative.runtime'
    compileSdk 36
    defaultConfig {
        testInstrumentationRunner "android.test.InstrumentationTestRunner"
        applicationId 'com.example.dotnativeapp'
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName '0.1'
        buildConfigField 'String', 'DOTNATIVE_LIBRARY', '"' + (project.findProperty('dotNativeLibraryName') ?: 'dotnative') + '"'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets { main { jniLibs.srcDirs = ['../obj/DotNative/jniLibs'] } }
}

// Native View-based nested scrolling, including parent/child fling handoff.
dependencies { implementation "androidx.recyclerview:recyclerview:1.4.0"; implementation "androidx.core:core:1.17.0"; implementation "com.google.android.material:material:1.13.0" }

// Package sources are staged by DotNative during publish.
android {
    sourceSets.main.java.srcDir '../obj/DotNative/native/plugin-java'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
kotlin { jvmToolchain(17) }

// Opt-in NativeAOT .NET bindings: Gradle still owns the existing Java runner.
if (project.hasProperty('dotNativeBindingsDir')) {
    def bindings = file(project.property('dotNativeBindingsDir'))
    android.sourceSets.main.jniLibs.setSrcDirs([new File(bindings, 'jniLibs')])
    android.sourceSets.main.java.srcDir new File(bindings, 'java')
    android.sourceSets.main.manifest.srcFile new File(bindings, 'AndroidManifest.xml')
    dependencies { implementation fileTree(dir: bindings, include: ['*.jar']) }
}

// Plugin dependency declarations are regenerated by DotNative on publish.
def pluginDependencies = file('../obj/DotNative/native/plugin-dependencies.gradle')
if (pluginDependencies.exists()) {
    apply from: pluginDependencies
}
